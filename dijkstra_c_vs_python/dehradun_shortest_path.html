<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Planner · Dynamic Waypoints</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Google Fonts: Quicksand & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Liquid Glass Theme Tokens */
            --glass-surface: rgba(255, 255, 255, 0.75);
            --glass-surface-subtle: rgba(255, 255, 255, 0.58);
            --glass-input-bg: rgba(255, 255, 255, 0.82);
            --glass-border: rgba(255, 255, 255, 0.70);
            --glass-border-subtle: rgba(255, 255, 255, 0.45);
            --glass-specular: inset 0 1px 1px 0 rgba(255, 255, 255, 0.95);
            --glass-blur: blur(24px) saturate(190%);
            --glass-blur-subtle: blur(16px) saturate(180%);
            --glass-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.16), 0 8px 20px -5px rgba(15, 23, 42, 0.06);
            --glass-shadow-float: 0 25px 55px -10px rgba(15, 23, 42, 0.20), 0 10px 25px -5px rgba(15, 23, 42, 0.08);

            --coral-500: #ff6b35;
            --coral-600: #fa541c;
            --coral-glass: linear-gradient(135deg, rgba(255, 107, 53, 0.92) 0%, rgba(250, 84, 28, 0.90) 100%);
            --coral-soft: rgba(255, 242, 232, 0.80);
            --coral-glow: rgba(255, 107, 53, 0.35);
            
            --success: #10b981;
            --success-soft: rgba(236, 253, 245, 0.85);
            --blue: #0284c7;
            --blue-soft: rgba(224, 242, 254, 0.85);
            --amber: #f59e0b;
            --amber-soft: rgba(254, 243, 199, 0.85);
            
            --text-main: #0f172a;
            --text-sub: #334155;
            --text-muted: #64748b;
            
            --radius-card: 22px;
            --radius-pill: 9999px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #e2e8f0;
            color: var(--text-main);
            font-size: 15px;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* Fullscreen Map */
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1;
            background: #f1f5f9;
        }

        /* Floating Liquid Glass Planner Island (Centered above Bottom Dashboard) */
        .planner-island {
            position: absolute;
            bottom: 115px;
            left: 50%;
            transform: translateX(-50%) translateY(0);
            width: 490px;
            max-width: calc(100vw - 32px);
            max-height: calc(100vh - 150px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            border-radius: var(--radius-card);
            background: var(--glass-surface);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow-float), var(--glass-specular);
            overflow: hidden;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease, visibility 0.45s;
            visibility: visible;
            opacity: 1;
        }

        /* Sliding Down / Hiding State Once Route is Set */
        .planner-island.minimized {
            transform: translateX(-50%) translateY(calc(100% + 150px));
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Restore Route Pill (Floating Glass Button at Bottom Center) */
        .restore-route-pill {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(90px);
            opacity: 0;
            visibility: hidden;
            z-index: 1100;
            background: var(--glass-surface);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-pill);
            padding: 11px 24px;
            font-family: 'Quicksand', sans-serif;
            font-size: 14.5px;
            font-weight: 700;
            color: var(--coral-600);
            box-shadow: var(--glass-shadow-float), var(--glass-specular);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .restore-route-pill.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .restore-route-pill:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.22);
        }

        /* Translucent Glass Header (Centered with Minimize Button) */
        .island-header {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.88) 0%, rgba(250, 84, 28, 0.85) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 18px 24px;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }

        .header-main-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.6px;
            line-height: 1.2;
            color: #ffffff;
            text-align: center;
        }

        .header-btn-hide {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.45);
            color: #ffffff;
            border-radius: 9px;
            padding: 4px 10px;
            font-family: 'Quicksand', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
        }

        .header-btn-hide:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        /* Scrollable Body */
        .island-body {
            padding: 18px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: calc(100vh - 120px);
        }

        /* Frosted Inputs Container */
        .routing-inputs-card {
            background: var(--glass-surface-subtle);
            backdrop-filter: var(--glass-blur-subtle);
            -webkit-backdrop-filter: var(--glass-blur-subtle);
            border: 1px solid var(--glass-border-subtle);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.8), 0 4px 14px rgba(15, 23, 42, 0.04);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 13px;
            position: relative;
        }

        .point-entry {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .point-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2.5px solid #ffffff;
            box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.15);
        }

        .dot-from {
            background: var(--success);
        }

        .dot-to {
            background: var(--blue);
        }

        .dot-stop {
            background: var(--amber);
        }

        .point-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .point-label {
            font-size: 12.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        .point-search-input {
            width: 100%;
            background: var(--glass-input-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 11px;
            padding: 10px 14px;
            font-family: 'Quicksand', sans-serif;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
            outline: none;
            box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04), 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }

        .point-search-input:focus {
            background: rgba(255, 255, 255, 0.95);
            border-color: var(--coral-500);
            box-shadow: 0 0 0 3.5px var(--coral-soft), inset 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .point-btn-del {
            background: rgba(255, 255, 255, 0.6);
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        .point-btn-del:hover {
            color: #ef4444;
            background: #fee2e2;
        }

        /* Autocomplete dropdown with Glassmorphism */
        .input-autocomplete-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            box-shadow: var(--glass-shadow), var(--glass-specular);
            z-index: 2000;
            max-height: 220px;
            overflow-y: auto;
            margin-top: 5px;
            display: none;
        }

        .autocomplete-row {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border-bottom: 1px solid rgba(226, 232, 240, 0.6);
            transition: background 0.15s ease;
        }

        .autocomplete-row:hover {
            background: rgba(248, 250, 252, 0.85);
        }

        .autocomplete-row:last-child {
            border-bottom: none;
        }

        .auto-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .auto-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .auto-cat {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: capitalize;
        }

        /* Add stop button with Frosted Glass */
        .btn-add-stop {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(8px);
            border: 1px dashed rgba(255, 107, 53, 0.45);
            border-radius: 11px;
            padding: 9px 14px;
            color: var(--coral-600);
            font-family: 'Quicksand', sans-serif;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-add-stop:hover {
            background: rgba(255, 242, 232, 0.85);
            border-color: var(--coral-500);
            border-style: solid;
            box-shadow: 0 4px 12px var(--coral-glow);
        }

        /* Connector Line */
        .connector-line {
            position: absolute;
            left: 22px;
            top: 36px;
            bottom: 36px;
            width: 2px;
            background: repeating-linear-gradient(to bottom, #cbd5e1, #cbd5e1 4px, transparent 4px, transparent 8px);
            z-index: 1;
            pointer-events: none;
        }

        /* Swap Button */
        .btn-swap-points {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08), inset 0 1px 1px #fff;
            color: var(--text-sub);
            font-size: 15px;
            z-index: 2;
            transition: all 0.15s ease;
        }

        .btn-swap-points:hover {
            background: rgba(255, 242, 232, 0.95);
            color: var(--coral-600);
            border-color: var(--coral-500);
        }

        /* Primary Action Button (Liquid Glass Coral) */
        .btn-optimize-go {
            background: var(--coral-glass);
            backdrop-filter: blur(12px);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 14px;
            padding: 15px 22px;
            font-family: 'Quicksand', sans-serif;
            font-size: 15.5px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px var(--coral-glow), inset 0 1px 2px rgba(255, 255, 255, 0.5);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-optimize-go:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 12px 28px var(--coral-glow), inset 0 1px 2px rgba(255, 255, 255, 0.6);
        }

        /* Floating Minimal Bottom Card (Liquid Glass) */
        .floating-bottom-card {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 530px;
            max-width: calc(100vw - 40px);
            background: var(--glass-surface);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: var(--radius-card);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow-float), var(--glass-specular);
            padding: 18px 26px;
            z-index: 1000;
            display: none;
            flex-direction: column;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .bottom-stats-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .stat-main-box {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .stat-dist-big {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--text-main);
            line-height: 1;
        }

        .stat-dist-unit {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .stat-meta-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sub);
        }

        .stat-dot-separator {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #cbd5e1;
        }

        .route-breadcrumb {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.4;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .breadcrumb-item {
            color: var(--text-main);
            font-weight: 600;
        }

        .bottom-actions-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 6px;
            border-top: 1px solid rgba(226, 232, 240, 0.6);
        }

        .btn-call-driver {
            flex: 1;
            background: var(--coral-glass);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 10px;
            padding: 10px 16px;
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px var(--coral-glow);
            transition: all 0.15s ease;
        }

        .btn-call-driver:hover {
            transform: translateY(-1px);
        }

        .btn-outline-card {
            background: rgba(255, 255, 255, 0.60);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 10px;
            padding: 10px 14px;
            font-family: 'Quicksand', sans-serif;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            box-shadow: inset 0 1px 1px #fff;
            transition: all 0.15s ease;
        }

        .btn-outline-card:hover {
            background: rgba(255, 255, 255, 0.85);
            border-color: #cbd5e1;
            color: var(--text-main);
        }

        .drag-tip-banner {
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            background: rgba(255, 255, 255, 0.52);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.65);
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.4;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.75);
        }

        /* Directions Slide-Out Drawer (Liquid Glass) */
        #directions-drawer {
            position: fixed;
            top: 0;
            right: -460px;
            width: 450px;
            max-width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border-left: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: -15px 0 45px rgba(0, 0, 0, 0.12);
            z-index: 2500;
            display: flex;
            flex-direction: column;
            transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #directions-drawer.open {
            right: 0;
        }

        .drawer-header {
            padding: 22px;
            border-bottom: 1px solid rgba(226, 232, 240, 0.7);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .drawer-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
        }

        .drawer-close {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.8);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
        }

        .drawer-body {
            padding: 22px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .step-timeline-item {
            display: flex;
            gap: 14px;
            position: relative;
        }

        .step-timeline-item:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 14px;
            top: 30px;
            bottom: -16px;
            width: 2px;
            background: #e2e8f0;
        }

        .step-badge-indicator {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12.5px;
            font-weight: 800;
            z-index: 2;
            flex-shrink: 0;
            color: var(--text-sub);
        }

        .step-timeline-item.origin .step-badge-indicator {
            border-color: var(--success);
            background: var(--success);
            color: #ffffff;
        }

        .step-timeline-item.destination .step-badge-indicator {
            border-color: var(--blue);
            background: var(--blue);
            color: #ffffff;
        }

        .step-timeline-item.waypoint .step-badge-indicator {
            border-color: var(--amber);
            background: var(--amber);
            color: #ffffff;
        }

        .step-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .step-name {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--text-main);
        }

        .step-road {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .step-meta {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--coral-600);
            margin-top: 2px;
        }

        /* Toast banner */
        #toast-banner {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px);
            color: #ffffff;
            padding: 10px 22px;
            border-radius: var(--radius-pill);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 13.5px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 3000;
            display: none;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, 10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        /* Leaflet Popups with Glassmorphism */
        .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(20px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
            border: 1px solid rgba(255, 255, 255, 0.8) !important;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.18), inset 0 1px 1px #fff !important;
            border-radius: 16px !important;
        }

        .leaflet-popup-tip {
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(20px) !important;
        }

        .minimal-popup {
            padding: 6px 2px;
            font-family: 'Quicksand', sans-serif;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 220px;
        }

        .pop-title {
            font-size: 14.5px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.25;
        }

        .pop-desc {
            font-size: 12.5px;
            color: var(--text-muted);
            line-height: 1.35;
        }

        .pop-actions {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 4px;
        }

<body>

    <!-- Fullscreen Map Container -->
    <div id="map"></div>

    <!-- Restore Route Pill (Visible when planner is hidden) -->
    <button id="restore-pill" class="restore-route-pill" onclick="openRoutePlanner()">
        &#9652; Select Route
    </button>

    <!-- Floating Liquid Glass Planner Island (Centered above Bottom Dashboard) -->
    <div class="planner-island">
        <!-- Translucent Glass Header (Centered) -->
        <div class="island-header">
            <div class="header-main-title">Select Route</div>
            <button class="header-btn-hide" title="Hide dashboard" onclick="hideRoutePlanner()">&#9662; Hide</button>
        </div>

        <!-- Body -->
        <div class="island-body">
            <!-- Points Input Card -->
            <div class="routing-inputs-card">
                <!-- FROM (Origin Point) -->
                <div class="point-entry">
                    <div class="point-dot dot-from"></div>
                    <div class="point-info">
                        <span class="point-label">Start Point</span>
                        <input type="text" id="input-origin" class="point-search-input" 
                               placeholder="Search start location or click map..." 
                               autocomplete="off"
                               oninput="onSearchType(this.value, 'origin')"
                               onfocus="onSearchFocus('origin')">
                        <div id="auto-origin" class="input-autocomplete-box"></div>
                    </div>
                </div>

                <!-- Swap Points Button -->
                <button class="btn-swap-points" title="Swap Start & Destination" onclick="swapOriginDestination()">
                    &#8645;
                </button>

                <!-- DYNAMIC STOPS CONTAINER -->
                <div id="stops-list-container">
                    <!-- Dynamic stops rendered here -->
                </div>

                <!-- ADD STOP BUTTON -->
                <button class="btn-add-stop" onclick="addNewStopRow()">
                    <span>+ Add Intermediate Stop</span>
                </button>

                <!-- Connector Line -->
                <div class="connector-line"></div>

                <!-- TO (Destination Point) -->
                <div class="point-entry">
                    <div class="point-dot dot-to"></div>
                    <div class="point-info">
                        <span class="point-label">Destination</span>
                        <input type="text" id="input-target" class="point-search-input" 
                               placeholder="Search destination or click map..." 
                               autocomplete="off"
                               oninput="onSearchType(this.value, 'target')"
                               onfocus="onSearchFocus('target')">
                        <div id="auto-target" class="input-autocomplete-box"></div>
                    </div>
                </div>
            </div>

            <!-- Drag & Pin Hint -->
            <div class="drag-tip-banner">
                Tip: Search any location or click directly on the map. Pins can be freely dragged anywhere with live road snapping.
            </div>

            <!-- Primary GO Button -->
            <button class="btn-optimize-go" id="btn-calculate" onclick="calculateRoute()">
                OPTIMIZE SHORTEST ROUTE
            </button>
        </div>
    </div>

    <!-- Floating Minimal Bottom Summary Card (Liquid Glass) -->
    <div class="floating-bottom-card" id="bottom-summary-card">
        <div class="bottom-stats-row">
            <div class="stat-main-box">
                <span class="stat-dist-big" id="card-dist">--</span>
                <span class="stat-dist-unit">km</span>
            </div>
            <div class="stat-meta-box">
                <span id="card-time">-- min</span>
                <span class="stat-dot-separator"></span>
                <span id="card-stops">--</span>
            </div>
        </div>

        <div class="bottom-actions-row">
            <button class="btn-call-driver" onclick="openRoutePlanner()">
                EDIT ROUTE
            </button>
            <button class="btn-outline-card" onclick="downloadCurrentJson()">
                Export JSON
            </button>
            <button class="btn-outline-card" onclick="openDirectionsDrawer()">
                Directions
            </button>
            <button class="btn-outline-card" onclick="viewJsonModal()">
                Raw JSON
            </button>
        </div>
    </div>

    <!-- Turn-By-Turn Slide-Out Drawer -->
    <div id="directions-drawer">
        <div class="drawer-header">
            <div class="drawer-title">Trip Directions</div>
            <button class="drawer-close" onclick="closeDirectionsDrawer()">&times;</button>
        </div>
        <div class="drawer-body" id="directions-list">

        </div>
    </div>
