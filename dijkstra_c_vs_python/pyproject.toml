[build-system]
requires = ["setuptools>=61.0", "cython"]
build-backend = "setuptools.build_meta"

[project]
name = "dijkstra-fast-solver"
version = "0.1.0"
authors = [{ name="Vansh Shah", email="vansh@example.com" }]
description = "A blazing fast C++ Dijkstra shortest path solver wrapped in Cython"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

